      <script>
        document.addEventListener('DOMContentLoaded', () => {
          const sections = document.querySelectorAll('section');
          const homeSection = document.getElementById('home');

          const showSection = (target) => {
            sections.forEach((section) => {
              section.style.display = 'none';
              section.style.opacity = '0';
            });

            const sectionToShow = target || homeSection;
            sectionToShow.style.display = 'block';
            sectionToShow.offsetHeight;
            sectionToShow.style.opacity = '1';
          };

          window.addEventListener('hashchange', () => {
            showSection(document.querySelector(window.location.hash));
          });

          showSection(window.location.hash ? document.querySelector(window.location.hash) : null);

          // Floating animation
          const floatImages = document.querySelectorAll('.random-art-collage img');
          floatImages.forEach((img, i) => {
            const floatSpeed = 3 + Math.random() * 3;
            const floatSize = 10 + Math.random() * 10;
            img.style.animation = `float${i} ${floatSpeed}s ease-in-out infinite alternate`;

            const style = document.createElement('style');
            style.textContent = `@keyframes float${i} {
              0% { transform: translateY(0); }
              100% { transform: translateY(-${floatSize}px); }
            }`;
            document.head.appendChild(style);
          });
        });
      </script>
